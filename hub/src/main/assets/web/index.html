<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MobileVision.Ai</title>
<meta name="theme-color" content="#f2f5fa">
<link rel="icon" href="img/adventure.jpg">
<style>
/* Layout: phone-first app shell. Light blue-grey ground, white rounded cards, one strong blue for actions.
   Car photos always sit on light tiles (mix-blend multiply removes their white backdrop). System fonts only (offline). */
:root{
  --bg:#f2f5fa; --card:#ffffff; --card-2:#f6f8fc; --fg:#0f1b2d; --muted:#667385; --line:#e2e8f0;
  --primary:#1769e8; --primary-ink:#ffffff; --primary-soft:#e7f0ff;
  --ok:#1f9d55; --ok-soft:#e5f6ec; --warn:#f29a0e; --bad:#d93a32; --bad-soft:#fdeceb;
  --tile:#eef2f8; --hero-a:#e3eeff; --hero-b:#f6f9ff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --sx:#a3a29d;
  --shadow:0 1px 2px rgba(15,27,45,.06), 0 4px 14px rgba(15,27,45,.05);
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --r:16px;
  color-scheme:light;
}
/* light theme only, as in the approved design */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--f-ui);-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 130px}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
svg.i{width:22px;height:22px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:18px;height:18px} svg.i.lg{width:26px;height:26px}
svg.i.fill{fill:currentColor;stroke:none}

/* header */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 12px) 0 12px;
  display:flex;align-items:center;gap:8px}
header.top h1{font-size:1.28rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.ibtn{border:0;background:transparent;color:var(--fg);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
.ibtn:active{background:var(--card-2)}
.brand{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
.brand em{font-style:normal;color:var(--primary)}
.subtitle{color:var(--muted);font-size:.9rem;margin:2px 0 0}

/* cards & buttons */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{border:0;border-radius:12px;padding:13px 14px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.soft{background:var(--card-2);color:var(--fg);border:1px solid var(--line)}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.block{width:100%}
.btn.big{min-height:58px;font-size:1.06rem;border-radius:14px}
.btn[disabled]{opacity:.45}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .btn{flex:1;min-width:130px;white-space:nowrap}
.pill{border:0;background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:7px 14px;font-weight:650;font-size:.9rem}
.label{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:20px 2px 8px;font-weight:600}
.label.blue{color:var(--primary)}
.meta{font-size:.86rem;color:var(--muted)}
.err{color:var(--bad);font-size:.9rem}
#cam{position:fixed;inset:0;z-index:40;background:#000;color:#fff;display:flex;flex-direction:column}
#cam[hidden]{display:none}
.cam-top{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:rgba(0,0,0,.72);z-index:2}
.cam-x{width:52px;height:52px;border-radius:14px;border:1px solid #3a4558;background:#151d2c;color:#fff;display:grid;place-items:center;flex:0 0 auto}
.cam-x svg{width:28px;height:28px}
.cam-title{flex:1;min-width:0}
.cam-title b{display:block;font-size:1.65rem;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.cam-title span{display:block;font:.85rem var(--f-num);color:#a9b4c4;margin-top:2px}
.cam-q{font:600 .8rem var(--f-ui);background:#1769e8;border-radius:999px;padding:4px 10px;white-space:nowrap}
.cam-q[hidden]{display:none}
.cam-stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden}
.cam-stage video,.cam-stage img{width:100%;height:100%;object-fit:contain;background:#000}
.cam-msg{position:absolute;left:16px;right:16px;top:40%;text-align:center;font-weight:600;color:#c9d2de}
.cam-bottom{padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 20px);background:rgba(0,0,0,.72);z-index:2}
.cam-bottom[hidden]{display:none}
.cam-live{display:flex;justify-content:center}
.shutter{width:84px;height:84px;border-radius:50%;border:5px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #000}
.shutter:active{transform:scale(.94)}
.shutter[disabled]{opacity:.5}
.review{position:fixed;inset:0;background:#070b14;z-index:22;display:flex;flex-direction:column;color:#e8eef6;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 18px);gap:10px}
.review .rv-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.review .rv-top b{font-size:1.1rem}
.review .rv-top span{font:.85rem var(--f-num);color:#97a3b4}
.review img{flex:1;min-height:0;width:100%;object-fit:contain;border-radius:12px;background:#000}
.rv-status{border-radius:12px;padding:10px 12px;font-weight:600;font-size:.95rem;background:#151d2c;display:flex;align-items:center;gap:8px}
.rv-status.ok{color:#38c172} .rv-status.warn{color:#f5a524;background:#2a2112} .rv-status.err{color:#ef5b52;background:#2e1513}
.rv-btns{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:12px;align-items:end}
.rv-btn{border:0;background:none;color:#e8eef6;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.82rem;font-weight:600}
.rv-btn .c{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#1b2536;border:1px solid #334058}
.rv-btn.ok .c{width:78px;height:78px;background:var(--ok);border-color:var(--ok);color:#fff}
.rv-btn.next .c{background:var(--primary);border-color:var(--primary);color:#fff}
.rv-btn svg{width:28px;height:28px}
.rv-btn.ok svg{width:36px;height:36px}
.rv-btn[disabled]{opacity:.4}
.rv-btn small{color:#97a3b4;font-weight:500;max-width:110px;text-align:center;line-height:1.2}
.wrap.wide{max-width:1040px}
.roles{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:640px){.roles{grid-template-columns:1fr 1fr}}
.role{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:20px;box-shadow:var(--shadow);min-height:170px}
.role .ico{width:56px;height:56px;border-radius:16px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
.role .ico svg{width:30px;height:30px}
.role h2{margin:0;font-size:1.35rem}
.role.last{border-color:var(--primary)}
.vlist{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
@media (min-width:900px){.vlist{grid-template-columns:1fr 1fr}}
.vrowc{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.vrowc .car{height:80px}
.vacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.vacts .btn{flex:1;min-width:150px;text-decoration:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-top:12px}
.pgrid .tile{aspect-ratio:1}
.pgrid .tile img{opacity:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.empty{color:var(--muted);padding:14px;font-size:.92rem}
.mono{font-family:var(--f-num);font-size:.78rem;color:var(--muted);word-break:break-all}
input[type=text],input[type=date],input[type=time],select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);min-height:48px}
select.compact{width:auto;min-height:40px;padding:8px 12px;border-radius:999px;font-weight:600;font-size:.9rem;background:var(--card-2)}

/* car tiles */
.car{background:var(--tile);border-radius:12px;overflow:hidden;display:grid;place-items:center}
.car img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;display:block}
.car.ph{color:var(--muted);background:var(--card-2)}

/* launcher */
.launch-head{padding:calc(env(safe-area-inset-top,0px) + 28px) 2px 18px}
.model{display:grid;grid-template-columns:132px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:var(--shadow)}
.model .car{height:92px}
.model h2{margin:0;font-size:1.3rem}
.model[disabled]{opacity:.55;box-shadow:none}
.model[disabled] .car{filter:grayscale(1)}
.soon{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);margin-top:4px}
.go{width:40px;height:40px;border-radius:12px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center}

/* punch home */
.hero{border-radius:20px;background:linear-gradient(120deg,var(--hero-a),var(--hero-b));padding:16px 8px 8px 18px;display:flex;align-items:center;gap:8px;
  overflow:hidden;min-height:136px;margin-bottom:14px}
.hero-text{flex:0 0 auto;color:#0b1f3f}
.hero-text b{display:block;font-size:.95rem;letter-spacing:.18em;color:#123f8c}
.hero-text strong{display:block;font-size:1.9rem;letter-spacing:.32em;font-weight:900;line-height:1.1;color:#0b1f3f}
.hero-text span{display:block;font-size:.78rem;color:#46597a;margin-top:6px}
.hero .car{background:transparent;flex:1;min-width:0;height:120px}
.vcard{display:flex;flex-direction:column;gap:12px}
.vtop{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;border:0;background:none;text-align:left;padding:0;width:100%}
.vtop .car{height:66px}
.vname{font-weight:700;font-size:1.08rem}
.vsub{font-size:.85rem;color:var(--muted)}
.vstat{display:flex;gap:12px;font-size:.82rem;color:var(--muted);margin-top:3px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.last{display:flex;align-items:center;gap:2px;color:var(--muted);font-size:.78rem;text-align:right}
.last b{display:block;color:var(--fg);font-family:var(--f-num);font-size:.86rem}
.zipcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r);
  background:var(--ok-soft);padding:14px;margin-top:14px}
.zipcard .ico{width:44px;height:44px;border-radius:12px;background:var(--ok);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.zipcard b{display:block;font-size:1.06rem}

/* vehicle checklist */
.vhead{display:flex;flex-direction:column;gap:10px}
.vrow{display:flex;align-items:center;gap:12px}
.vnum{font:800 1.9rem var(--f-num);letter-spacing:-.02em}
.swatch{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:0 0 auto}
.vcolor{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-weight:600}
.bar{height:10px;background:var(--card-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .25s}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.seg button{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:14px;
  padding:12px;font-weight:650;min-height:52px}
.seg button[aria-selected="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:16px 2px 8px}
.sechead h2{margin:0;font-size:1.06rem}
.sechead span{font-weight:800;font-size:1.06rem;color:var(--primary)}
.cps{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.cp{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px;border-top:1px solid var(--line);cursor:pointer}
.cp:first-child{border-top:0}
.cp.next{background:var(--primary-soft)}
.st{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 .95rem var(--f-num);border:2px solid var(--line);color:var(--muted)}
.cp.done .st{background:var(--ok);border-color:var(--ok);color:#fff}
.cp.next .st{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.cp-name{font-weight:650;margin-bottom:6px;min-width:0}
.thumbs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.thumbs button,.thumbs .ph{flex:0 0 auto;width:52px;height:40px;border-radius:8px;border:0;padding:0;overflow:hidden;background:var(--card-2);display:grid;place-items:center;color:var(--muted)}
.thumbs .ph{border:1px dashed var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.cp-right{display:flex;align-items:center;gap:4px;color:var(--muted)}
.count{min-width:30px;height:28px;border-radius:8px;background:var(--card-2);border:1px solid var(--line);display:grid;place-items:center;font:700 .85rem var(--f-num);color:var(--fg);padding:0 6px}
.busy{grid-column:2/-1;font-size:.82rem;color:var(--primary)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px);z-index:6}
.dock-in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.dock .side{width:62px;min-width:62px;flex:0 0 auto;flex-direction:column;gap:2px;font-size:.7rem;padding:6px;min-height:62px}
.dock .main{flex:1;min-height:62px;justify-content:space-between;text-align:left;padding:10px 16px}
.dock .main b{display:block;font-size:1rem;line-height:1.2}
.dock .main small{display:block;font-weight:500;opacity:.85;font-size:.8rem}

/* viewer & sheets */
.viewer{position:fixed;inset:0;background:#070b14;z-index:20;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);gap:12px}
.viewer img{flex:1;min-height:0;width:100%;object-fit:contain}
.viewer .name{color:#e7ebef;font:.78rem var(--f-num);word-break:break-all}
.viewer .btn.ghost{background:#1b2333;color:#fff;border-color:#334058}
.confirm{border:1px solid var(--bad);border-radius:14px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0}
.viewer .confirm{background:#151d2c;color:#e8eef6}
.sheet-bg{position:fixed;inset:0;background:rgba(5,9,18,.5);z-index:25;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;
  padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px}
.sheet::before{content:"";width:40px;height:4px;border-radius:4px;background:var(--line);align-self:center}
.sheet h2{margin:0;font-size:1.12rem}
.menu-item{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--card-2);border-radius:14px;padding:14px}
.menu-item .ico{width:42px;height:42px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:0 0 auto}
.menu-item b{display:block}
.menu-item span{font-size:.84rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);box-shadow:0 6px 20px rgba(0,0,0,.25);text-align:center;
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:30;max-width:90vw}

/* lists (settings) */
.list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.list li{display:flex;align-items:center;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list li>span{flex:1;min-width:0}
.x{border:0;background:none;color:var(--bad);font-size:.9rem;padding:6px 8px;border-radius:8px;font-weight:600}
.x.mv{color:var(--fg);border:1px solid var(--line);width:36px;height:36px;display:grid;place-items:center;padding:0}
.x.edit{color:var(--primary)}
.x[disabled]{opacity:.3}
.tag{color:var(--primary);font-size:.76rem;font-weight:600}
.add{display:flex;gap:8px;margin-top:8px}
.add input{flex:1;min-width:0}

/* photos browser */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin-bottom:12px}
.crumb{border:0;background:none;color:var(--primary);font-weight:600;font-size:.88rem;padding:4px 2px;word-break:break-all;text-align:left}
.crumb:last-of-type{color:var(--fg)}
.crumb-sep{color:var(--muted)}
.folders button{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;padding:14px 12px;text-align:left}
.folders li{padding:0}
.folder-ico{width:40px;height:40px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:0 0 auto}
.folder-name{flex:1;min-width:0;word-break:break-all;font-weight:600}
.folder-count{font:.85rem var(--f-num);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{border:0;padding:0;background:var(--card-2);border-radius:10px;overflow:hidden;position:relative;aspect-ratio:1;max-width:100%}
.tile img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .2s}
.tile img.ready{opacity:1}
.qb{position:absolute;top:4px;right:4px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;
  font:800 .7rem var(--f-ui);color:#fff;background:var(--warn);box-shadow:0 0 0 2px var(--card);padding:0 4px}
.qb.ok{background:var(--ok)}
.qb.wait{background:#8b97a8;font-size:.72rem}
.synccard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:14px;margin-top:14px}
.synccard .ico{width:44px;height:44px;border-radius:12px;color:#fff;display:grid;place-items:center;flex:0 0 auto}
.synccard b{display:block;font-size:1.06rem}
.mirror{background:var(--primary-soft);color:var(--primary);border-radius:12px;padding:10px 12px;font-size:.88rem;font-weight:600;margin-bottom:12px}
.thumbs button{position:relative}
.result{border-radius:12px;padding:10px 12px;font-size:.88rem;background:#1b2333;color:#e8eef6;display:flex;flex-direction:column;gap:4px}
.result b{font-size:.95rem}
.result.warn b{color:#f5a524} .result.ok b{color:#38c172}
.result .nums{font:.78rem var(--f-num);color:#97a3b4}
.tile-cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font:.64rem var(--f-num);padding:3px 5px;text-align:left}

/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tstat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow)}
.tstat .hd{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);font-weight:600}
.tstat .hd .i{color:var(--primary)}
.tstat.ok .hd .i{color:var(--ok)}
.tstat b{font:800 1.6rem var(--f-num)}
.chart h2{margin:0;font-size:1.06rem}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);margin:6px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;flex:0 0 auto}
.hbars{display:flex;flex-direction:column;gap:4px}
.hbar{display:grid;grid-template-columns:minmax(0,44%) 1fr auto;align-items:center;gap:10px;border:0;background:none;padding:6px 0;text-align:left;width:100%}
.hbar-label{font-size:.88rem;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.hbar-track{display:flex;gap:2px;height:12px;min-width:0;background:var(--card-2);border-radius:999px;overflow:hidden}
.hbar-track i{display:block;height:100%;min-width:3px}
.hbar-track i:last-child{border-radius:0 999px 999px 0}
.hbar-val{font:700 .88rem var(--f-num);min-width:2ch;text-align:right}
.hbar.zero .hbar-label,.hbar.zero .hbar-val{color:var(--bad)}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:0 0 auto;max-width:100%}
.donut text{fill:var(--fg)}
.donut .sub{fill:var(--muted);font-size:11px}
.donut-legend{list-style:none;margin:0;padding:0;flex:1;min-width:160px;display:flex;flex-direction:column;gap:10px}
.donut-legend li{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;font-size:.92rem}
.donut-legend b{font-family:var(--f-num)}
.donut-legend em{font-style:normal;color:var(--muted);font:.8rem var(--f-num);min-width:4ch;text-align:right}
.s1{background:var(--s1);stroke:var(--s1)} .s2{background:var(--s2);stroke:var(--s2)} .s3{background:var(--s3);stroke:var(--s3)}
.s4{background:var(--s4);stroke:var(--s4)} .s5{background:var(--s5);stroke:var(--s5)} .s6{background:var(--s6);stroke:var(--s6)}
.s7{background:var(--s7);stroke:var(--s7)} .s8{background:var(--s8);stroke:var(--s8)} .sx{background:var(--sx);stroke:var(--sx)}
.ok-bg{background:var(--ok)} .warn-bg{background:var(--warn)} .pri-bg{background:var(--primary)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-top:12px}
.table-wrap table{width:100%;border-collapse:collapse;font-size:.88rem}
.table-wrap th,.table-wrap td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.table-wrap th:first-child,.table-wrap td:first-child{text-align:left}
.table-wrap th{color:var(--muted);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em}
.table-wrap tr:last-child td{border-bottom:0}

/* zip */
.range{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rbox{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--card-2);min-width:0}
.rbox .meta{display:flex;align-items:center;gap:6px;font-weight:600}
.rbox input{min-height:42px;padding:8px;background:var(--card)}
.summary{display:flex;align-items:center;gap:14px;background:var(--primary-soft);border-radius:var(--r);padding:14px}
.summary .ico{width:46px;height:46px;border-radius:12px;background:var(--card);color:var(--primary);display:grid;place-items:center;flex:0 0 auto}
.summary b{display:block;font-size:1.08rem}
.ready{background:var(--ok-soft);border:1px solid var(--ok);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ready-head{display:flex;gap:12px;align-items:center}
.ready-head .ico{width:42px;height:42px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.ready-head b{display:block;color:var(--ok);font-size:1.1rem}
.zips li{flex-direction:column;align-items:stretch}
.zrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:0}
.zrow .ico{width:42px;height:42px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:0 0 auto}
.zrow>div{flex:1;min-width:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="wrap" id="app"></div>
<div id="toast" class="toast" hidden></div>
<div id="cam" hidden>
  <div class="cam-top">
    <button class="cam-x" id="camClose" aria-label="Close camera"></button>
    <div class="cam-title"><b id="camName">Checkpoint</b><span id="camSub"></span></div>
    <span class="cam-q" id="camQ" hidden></span>
  </div>
  <div class="cam-stage">
    <video id="camVideo" playsinline autoplay muted></video>
    <img id="camShot" alt="" hidden>
    <div class="cam-msg" id="camMsg" hidden></div>
  </div>
  <div class="cam-bottom cam-live" id="camLive"><button class="shutter" id="camShutter" aria-label="Take photo"></button></div>
  <div class="cam-bottom" id="camReview" hidden>
    <div class="rv-btns">
      <button class="rv-btn" id="camRetake"><span class="c"></span>Retake</button>
      <button class="rv-btn ok" id="camOk"><span class="c"></span>Correct</button>
      <button class="rv-btn next" id="camNext"><span class="c"></span><span id="camNextLbl">Next</span><small id="camNextName"></small></button>
    </div>
  </div>
</div>
<script src="bridge.js"></script>
<script>
// ---------- icons ----------
const ICONS = {
  back:'<path d="M15 18l-6-6 6-6"/>', chev:'<path d="M9 6l6 6-6 6"/>', plus:'<path d="M12 5v14M5 12h14"/>',
  play:'<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>', menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  gear:'<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.2"/>',
  check:'<path d="M20 6 9 17l-5-5"/>', x:'<path d="M18 6 6 18M6 6l12 12"/>',
  car:'<path d="M19 17h2v-4l-2.2-5.2A2 2 0 0 0 17 6.5H7a2 2 0 0 0-1.8 1.3L3 13v4h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M9 17h6M3 13h18"/>',
  image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 15-5-5L5 20"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M10 12h1M10 15h1M10 18h1"/>',
  share:'<path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/>',
  bt:'<path d="m7 7 10 10-5 5V2l5 5L7 17"/>', folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  chart:'<path d="M3 3v18h18M7 16v-4M12 16V8M17 16v-7"/>', lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  up:'<path d="M12 19V5M5 12l7-7 7 7"/>', down:'<path d="M12 5v14M19 12l-7 7-7-7"/>', next:'<path d="M5 12h14M13 5l7 7-7 7"/>',
  dots:'<circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/>',
  retake:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  laptop:'<rect x="4" y="4" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>',
  phone:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
  zip:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 11v6M10 14l2 3 2-3"/>',
};
const ic = (n, cls="") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;

const S = { cfg:null, screen:"launch", variant:null, vehicle:null, section:"interior", progress:null,
            busy:null, viewer:null, confirm:null, lastOnDisk:{}, storage:null,
            returnTo:"home", zip:null, sheet:null, menu:false, browse:null, stats:null, homeStats:null };
const $app = document.getElementById("app");
const SECTIONS = ["interior","exterior"];

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad3 = n => String(n).padStart(3,"0");
const two = n => String(n).padStart(2,"0");
const V = () => S.cfg.variants.find(v => v.id === S.variant);
const clone = o => JSON.parse(JSON.stringify(o));

function nat(name, ...args){
  if(!window.Native) throw new Error("Open this page inside the MobileVision.Ai app.");
  const o = JSON.parse(window.Native[name](...args));
  if(o && o.error) throw new Error(o.error);
  return o;
}
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false;
  clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, 2400); }
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

// ---------- car pictures & color swatches ----------
function carImg(variantName){
  const n=(variantName||"").toLowerCase();
  const f = n.includes("smart") ? "smart" : n.includes("plus") ? "pureplus" : n.includes("pure") ? "pure"
          : n.includes("advent") ? "adventure" : n.includes("accomp") ? "accomplished" : "pure";
  return `img/${f}.jpg`;
}
function carTile(variantName){ return `<div class="car"><img src="${carImg(variantName)}" alt=""></div>`; }
const SWATCH = [["white","#f6f6f4"],["pristine","#f6f6f4"],["grey","#7d8591"],["gray","#7d8591"],["daytona","#7d8591"],["silver","#c3c8cf"],
  ["blue","#1f6fd6"],["tornado","#1f6fd6"],["ocean","#1d5fa8"],["red","#d8322e"],["calypso","#d8322e"],["flame","#d8322e"],
  ["orange","#f07a1a"],["atomic","#f07a1a"],["tropical","#f07a1a"],["black","#20232a"],["meteor","#3b3f46"],
  ["green","#2f8f4e"],["yellow","#e8b400"],["brown","#8a5a36"],["bronze","#8a5a36"]];
function swatchColor(name){
  const n=(name||"").toLowerCase();
  for(const [k,c] of SWATCH) if(n.includes(k)) return c;
  return "var(--muted)";
}

// ---------- config model ----------
function slug(t){
  const s = String(t).trim().replace(/[^A-Za-z0-9]+/g,"_").replace(/^_+|_+$/g,"");
  if(!s) throw new Error("Name must contain letters or numbers.");
  return s;
}
const itemId = t => slug(t).toLowerCase();
function normalize(cfg){
  let changed=false;
  if(!cfg.common){
    const v0=cfg.variants[0]||{interior:[],exterior:[]};
    cfg.common={interior:clone(v0.interior||[]), exterior:clone(v0.exterior||[])}; changed=true;
  }
  if(!cfg.colors){
    const seen={}; cfg.colors=[];
    cfg.variants.forEach(v => (v.colors||[]).forEach(c => { if(!seen[c.id]){ seen[c.id]=1; cfg.colors.push(c); } }));
    changed=true;
  }
  cfg.variants.forEach(v => { if(v.colors){ delete v.colors; changed=true; } });
  return changed;
}
function commit(cfg){ S.cfg = nat("putConfig", JSON.stringify(cfg)); }
function edit(fn){ const c=clone(S.cfg); fn(c); commit(c); }
function findV(c, id){ return c.variants.find(v=>v.id===id); }
function move(arr, i, d){ const j=i+d; if(j<0||j>=arr.length) return false; [arr[i],arr[j]]=[arr[j],arr[i]]; return true; }
function followCommonOrder(list, common){
  const rank={}; common.forEach((c,i)=>rank[c.id]=i);
  const slots=[], items=[];
  list.forEach((c,i)=>{ if(c.id in rank){ slots.push(i); items.push(c); } });
  items.sort((a,b)=>rank[a.id]-rank[b.id]);
  slots.forEach((s,k)=>list[s]=items[k]);
}
const ops = {
  addColor(name){ edit(c=>{ const id=itemId(name);
    if(c.colors.some(x=>x.id===id)) throw new Error(`${name} is already in the color list.`);
    c.colors.push({id, name:name.trim()}); }); },
  removeColor(id){ edit(c=>{ c.colors=c.colors.filter(x=>x.id!==id); }); },
  moveColor(id,d){ edit(c=>{ move(c.colors, c.colors.findIndex(x=>x.id===id), d); }); },
  addVariant(name, from){ edit(c=>{ const id=slug(name);
    if(c.variants.some(v=>v.id.toLowerCase()===id.toLowerCase())) throw new Error(`Variant ${name} already exists.`);
    const src = from ? findV(c,from) : c.common;
    c.variants.push({id, name:name.trim(), interior:clone(src.interior), exterior:clone(src.exterior)}); }); },
  removeVariant(id){ edit(c=>{ c.variants=c.variants.filter(v=>v.id!==id); }); },
  moveVariant(id,d){ edit(c=>{ move(c.variants, c.variants.findIndex(v=>v.id===id), d); }); },
  addCommon(sec, name){ edit(c=>{ const id=itemId(name);
    if(c.common[sec].some(x=>x.id===id)) throw new Error(`${name} is already a common ${sec} checkpoint.`);
    const item={id, name:name.trim()};
    c.common[sec].push(item);
    c.variants.forEach(v=>{ if(!v[sec].some(x=>x.id===id)) v[sec].push(clone(item)); }); }); },
  removeCommon(sec, id){ edit(c=>{
    c.common[sec]=c.common[sec].filter(x=>x.id!==id);
    c.variants.forEach(v=>v[sec]=v[sec].filter(x=>x.id!==id)); }); },
  moveCommon(sec, id, d){ edit(c=>{
    if(!move(c.common[sec], c.common[sec].findIndex(x=>x.id===id), d)) return;
    c.variants.forEach(v=>followCommonOrder(v[sec], c.common[sec])); }); },
  addOwn(vid, sec, name){ edit(c=>{ const v=findV(c,vid), id=itemId(name);
    if(v[sec].some(x=>x.id===id)) throw new Error(`${name} is already in ${v.name} ${sec}.`);
    const fromCommon=c.common[sec].find(x=>x.id===id);
    v[sec].push(fromCommon ? clone(fromCommon) : {id, name:name.trim()}); }); },
  removeOwn(vid, sec, id){ edit(c=>{ const v=findV(c,vid); v[sec]=v[sec].filter(x=>x.id!==id); }); },
  moveOwn(vid, sec, id, d){ edit(c=>{ const v=findV(c,vid); move(v[sec], v[sec].findIndex(x=>x.id===id), d); }); },
  resetOwn(vid){ edit(c=>{ const v=findV(c,vid); v.interior=clone(c.common.interior); v.exterior=clone(c.common.exterior); }); },
};

// ---------- data ----------
function loadConfig(){
  const c = nat("getConfig");
  if(normalize(c)){ S.cfg=c; commit(c); } else S.cfg=c;
}
function loadLastVehicles(){ S.lastOnDisk = nat("lastVehicles"); }
function loadProgress(){ S.progress = nat("progress", S.variant, S.vehicle); }
function counts(section){
  const v=V(), p=S.progress||{}; let done=0;
  v[section].forEach(c => { if(((p[section]||{})[c.id]||[]).length) done++; });
  return {done, total:v[section].length};
}
function nextPending(){
  for(const s of SECTIONS)
    for(const c of V()[s]) if(!((S.progress[s]||{})[c.id]||[]).length) return {section:s, cp:c};
  return null;
}
function pendingCount(){
  let n=0; for(const s of SECTIONS) for(const c of V()[s]) if(!((S.progress[s]||{})[c.id]||[]).length) n++; return n;
}

// ---------- processing results (done on the laptop) ----------
const HUB = () => !!(S.storage && S.storage.hub);
function qBadge(r, ph){
  if(!r || !r.status) return "";
  return r.status==="warn" ? `<span class="qb" title="${esc((r.checks||[]).join(", "))}">!</span>` : "";
}
function resultHTML(r){
  if(!r) return "";
  const ok = r.status!=="warn";
  const extra = r.detections ? `<span>Detected: ${esc(r.detections.join(", ")||"nothing")}</span>` : "";
  return `<div class="result ${ok?"ok":"warn"}"><b>${ok ? "Checks passed" : esc((r.checks||[]).join(" · "))}</b>${extra}
    <span class="nums">sharpness ${r.sharpness ?? "–"} · brightness ${r.brightness ?? "–"}</span></div>`;
}

function hubCard(){
  return `<div class="synccard"><span class="ico" style="background:var(--ok)">${ic("phone")}</span>
    <span style="flex:1"><b>Saved on the phone hub</b><span class="meta">Download on the laptop: open this same address and choose Laptop</span></span></div>`;
}
function syncCard(){
  let st=null; try{ st=nat("syncStatus"); }catch(e){}
  const on = st && st.laptopSeenMs>=0 && st.laptopSeenMs<20000;
  const txt = !st ? "Status not available" : on ? (st.waiting ? `${st.waiting} photo${st.waiting===1?"":"s"} on the way` : "All photos are on the laptop")
            : st.laptopSeenMs<0 ? "Laptop not connected yet: start run.bat on it" : `Laptop last seen ${Math.max(1,Math.round(st.laptopSeenMs/60000))} min ago${st.waiting?` · ${st.waiting} waiting`:""}`;
  return `<button class="synccard" data-act="refreshHome">
    <span class="ico" style="background:${on?"var(--ok)":"var(--warn)"}">${ic(on?"check":"share")}</span>
    <span style="flex:1"><b>Laptop sync</b><span class="meta">${esc(txt)}</span></span>${ic("chev")}</button>`;
}

// ---------- render ----------
function render(){
  if(S.storage && !S.storage.granted) return renderPermission();
  document.getElementById("app").classList.toggle("wide", S.screen==="laptop" || S.screen==="role" || (S.settingsFrom==="laptop" && (S.screen==="global" || S.screen==="setup")));
  ({role:renderRole, laptop:renderLaptop, launch:renderLaunch, home:renderHome, vehicle:renderVehicle, setup:renderSetup, global:renderGlobal, zip:renderZip,
    browse:renderBrowse, stats:renderStats})[S.screen]();
  if(S.sheet) $app.insertAdjacentHTML("beforeend", sheetHTML());
  if(S.menu) $app.insertAdjacentHTML("beforeend", menuHTML());
}

function renderPermission(){
  $app.innerHTML = `
    <div class="launch-head"><p class="brand">MobileVision<em>.Ai</em></p></div>
    <div class="card stack">
      <h2 style="margin:0;font-size:1.15rem">Allow file access</h2>
      <p style="margin:0">Photos are saved in a <b>PunchCapture</b> folder on this device, sorted by variant, color and checkpoint, so you can copy it to a laptop.</p>
      <p class="meta" style="margin:0">On the next screen, turn on <b>Allow access to manage all files</b>, then come back.</p>
      <button class="btn primary block" data-act="grant">Open settings</button>
    </div>`;
}

function renderLaunch(){
  const pv = S.cfg.variants.length;
  $app.innerHTML = `
    <div class="launch-head">
      <p class="brand">MobileVision<em>.Ai</em></p>
      <p class="subtitle">Vision data collection for Tata Motors vehicles</p>
    </div>
    <div class="stack">
      <button class="model" data-act="openPunch">
        <div class="car"><img src="img/adventure.jpg" alt=""></div>
        <div><h2>Punch</h2><div class="meta">${pv} variant${pv===1?"":"s"} · tap to start</div></div>
        <span class="go">${ic("chev")}</span>
      </button>
      <button class="model" disabled aria-disabled="true">
        <div class="car ph">${ic("car","lg")}</div>
        <div><h2>Harrier</h2><span class="soon">${ic("lock","sm")}Coming soon</span></div><span></span>
      </button>
      <button class="model" disabled aria-disabled="true">
        <div class="car ph">${ic("car","lg")}</div>
        <div><h2>Safari</h2><span class="soon">${ic("lock","sm")}Coming soon</span></div><span></span>
      </button>
    </div>
    <p class="meta" style="margin-top:24px">v${esc(S.storage ? S.storage.version : "")} · ${HUB() ? "connected through the phone hub" : "photos are saved and processed on the laptop server"}</p>
    ${HUB() ? `<button class="btn ghost" data-act="toRole" style="margin-top:4px">${ic("laptop","sm")}Switch device</button>` : ""}`;
}

function lastRole(){ try{ return localStorage.getItem("mv-role")||""; }catch(e){ return ""; } }
function renderRole(){
  const last = lastRole();
  $app.innerHTML = `
    <div class="launch-head"><p class="brand">MobileVision<em>.Ai</em></p><p class="subtitle">Which device is this?</p></div>
    <div class="roles">
      <button class="role ${last==="zebra"?"last":""}" data-act="pickRole" data-r="zebra">
        <span class="ico">${ic("camera")}</span><h2>Zebra</h2>

function variantStatus(){
  // complete / partial vehicles per variant, all time
  const out={};
  try{
    const raw = nat("stats").photos, veh={};
    raw.forEach(p=>{ if(!p.n) return; const k=p.v+"|"+p.n; (veh[k]=veh[k]||{v:p.v, cps:new Set()}).cps.add(p.s+"/"+p.c); });
    S.cfg.variants.forEach(v=>{
      const need=SECTIONS.flatMap(s=>v[s].map(c=>s+"/"+c.id));
      const vs=Object.values(veh).filter(x=>x.v===v.id);
      const complete=vs.filter(x=>need.length && need.every(k=>x.cps.has(k))).length;
      out[v.id]={complete, partial:vs.length-complete};
    });
  }catch(e){}
  return out;
}

function todayStr(d=new Date()){ return `${d.getFullYear()}-${two(d.getMonth()+1)}-${two(d.getDate())}`; }
function mb(b){ return b >= 1e9 ? (b/1e9).toFixed(2)+" GB" : (b/1e6).toFixed(1)+" MB"; }
function fmtTime(t){ const d=new Date(t); return `${two(d.getDate())}/${two(d.getMonth()+1)} ${two(d.getHours())}:${two(d.getMinutes())}`; }
function fmtLong(t){ const d=new Date(t); return d.toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"})+", "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
function zipRange(){

const SERIES = 8;
function colorSlot(name){ const i = S.cfg.colors.findIndex(c=>c.name===name); return i < 0 ? null : i; }
function dayRange(f){
  if(f.range==="all") return null;
  const ds = f.range==="today" ? todayStr() : f.date;
  const [y,m,d]=ds.split("-").map(Number);
  return [new Date(y,m-1,d).getTime(), new Date(y,m-1,d,23,59,59,999).getTime()];
}
function statsModel(){
  const st=S.stats, rng=dayRange(st);
  const photos = st.raw.filter(p => !rng || (p.t>=rng[0] && p.t<=rng[1]));
  const vehicles = {};
  photos.forEach(p => {
    if(!p.n) return;
    const k=p.v+"|"+p.n;
    (vehicles[k] = vehicles[k] || {v:p.v, n:p.n, col:p.col, cps:new Set()}).cps.add(p.s+"/"+p.c);
  });
  const order = S.cfg.variants.map(v=>v.id);
  photos.forEach(p => { if(!order.includes(p.v)) order.push(p.v); });
  const byVariant = order.map(id => {
    const v=findV(S.cfg,id), need = v ? SECTIONS.flatMap(s=>v[s].map(c=>s+"/"+c.id)) : [];
    const vs = Object.values(vehicles).filter(x=>x.v===id);
    const complete = vs.filter(x => need.length && need.every(k=>x.cps.has(k))).length;
    return {id, name: v ? v.name : id, complete, partial: vs.length-complete, vehicles: vs, photos: photos.filter(p=>p.v===id)};
  });
  return {photos, vehicles:Object.values(vehicles), byVariant};
}
function hbar(label, segs, max, act, zero){
  const total = segs.reduce((a,s)=>a+s.n,0);
  const tag = act ? `button data-act="${act.a}" data-id="${esc(act.id)}"` : "div";
  return `<${tag} class="hbar${zero?" zero":""}">
    <span class="hbar-label">${esc(label)}</span>
    <span class="hbar-track">${segs.filter(s=>s.n).map(s=>`<i class="${s.cls}" style="width:${max? s.n/max*100 : 0}%"></i>`).join("")}</span>
    <span class="hbar-val">${total}</span></${act?"button":"div"}>`;
}
function donutSVG(slices, total, caption){
  const R=58, C=75, W=22, circ=2*Math.PI*R;
  let off=0;
  const arcs = slices.filter(s=>s.n).map(s=>{
    const len=s.n/total*circ, gap=slices.filter(x=>x.n).length>1 ? 2 : 0;
    const el=`<circle cx="${C}" cy="${C}" r="${R}" fill="none" class="${s.cls}" stroke-width="${W}"
      stroke-dasharray="${Math.max(0,len-gap)} ${circ}" stroke-dashoffset="${-off}" transform="rotate(-90 ${C} ${C})"/>`;
    off+=len; return el;
  }).join("");
  return `<svg viewBox="0 0 150 150" class="donut" role="img" aria-label="${total} ${caption} by color">
    <circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="var(--card-2)" stroke-width="${W}"/>${arcs}
    <text x="${C}" y="${C+4}" text-anchor="middle" font-size="26" font-weight="800">${total}</text>
    <text x="${C}" y="${C+22}" text-anchor="middle" class="sub">${caption}</text></svg>`;
}

// ---------- built-in camera (needs https; falls back to the phone's camera app on plain http) ----------
const CAM = {stream:null, track:null, ic:null, ctx:null, blob:null, url:null, pending:0, busy:false};
const $c = id => document.getElementById(id);
function camSupported(){ return !!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }

function startCapture(section, cid, replace){
  if(!camSupported()){
    S.busy={section, cp:cid}; S.section=section; render();
    Native.takePhoto(S.variant, section, cid, S.vehicle, replace||"");
    return;
  }
  camOpen(section, cid, replace||"");

async function camOpen(section, cid, replace){
  CAM.ctx={section, cp:cid, replace};
  S.section=section;
  $c("cam").hidden=false; camLive(); camLabel();
  if(CAM.stream) return;
  $c("camMsg").hidden=false; $c("camMsg").textContent="Starting camera…";
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:"environment"}, width:{ideal:4096}, height:{ideal:3072}}});
    CAM.stream=stream; CAM.track=stream.getVideoTracks()[0];
    $c("camVideo").srcObject=stream;
    try{ await CAM.track.applyConstraints({advanced:[{torch:false}]}); }catch(e){}
    try{ await CAM.track.applyConstraints({advanced:[{focusMode:"continuous"}]}); }catch(e){}
    CAM.ic = ("ImageCapture" in window) ? new ImageCapture(CAM.track) : null;
    $c("camMsg").hidden=true;
  }catch(e){
    $c("camMsg").textContent = "Camera not available: allow camera access for this site (lock icon in the address bar), then try again.";
  }
}

function camClose(){
  $c("cam").hidden=true;
  if(CAM.url){ URL.revokeObjectURL(CAM.url); CAM.url=null; } CAM.blob=null;
  if(CAM.stream){ CAM.stream.getTracks().forEach(t=>t.stop()); CAM.stream=null; CAM.track=null; CAM.ic=null; }
  S.busy=null;
  try{ loadProgress(); }catch(e){}
  render();
  const nxt=nextPending(); if(nxt) document.getElementById("cp-"+nxt.cp.id)?.scrollIntoView({block:"center"});
}

function camLabel(){
  const v=V(), list=v[CAM.ctx.section], i=list.findIndex(c=>c.id===CAM.ctx.cp), cp=list[i]||{name:CAM.ctx.cp};
  $c("camName").textContent=cp.name;
  $c("camSub").textContent=`${CAM.ctx.section==="interior"?"Interior":"Exterior"} · ${i+1} of ${list.length} · V${pad3(S.vehicle)}${CAM.ctx.replace?" · retake":""}`;
  const nx=nextInSection(CAM.ctx.section, CAM.ctx.cp);
  $c("camNextLbl").textContent = nx ? "Next" : "Done";
  $c("camNextName").textContent = nx ? nx.name : (CAM.ctx.section==="interior" ? "Interior done" : "Exterior done");
  $c("camNext").querySelector(".c").innerHTML = ic(nx ? "next" : "check");
}
function camQueue(){ const q=$c("camQ"); q.hidden=!CAM.pending; q.textContent=`Saving ${CAM.pending}`; }
function camLive(){
  $c("camShot").hidden=true; $c("camVideo").hidden=false;
  $c("camLive").hidden=false; $c("camReview").hidden=true; $c("camShutter").disabled=false;
}

async function camShoot(){
  if(!CAM.track || CAM.busy) return;
  CAM.busy=true; $c("camShutter").disabled=true;
  let blob=null;
  try{
    if(CAM.ic && CAM.ic.takePhoto){
      let opts={fillLightMode:"off"};
      try{ const caps=await CAM.ic.getPhotoCapabilities(); if(caps.imageWidth && caps.imageWidth.max) opts={...opts, imageWidth:caps.imageWidth.max, imageHeight:caps.imageHeight.max}; }catch(e){}
      try{ blob=await CAM.ic.takePhoto(opts); }catch(e){ blob=await CAM.ic.takePhoto(); }
    }
  }catch(e){ blob=null; }
  if(!blob){   // fallback: grab the video frame at the stream's resolution
    const v=$c("camVideo"), cv=document.createElement("canvas");
    cv.width=v.videoWidth; cv.height=v.videoHeight; cv.getContext("2d").drawImage(v,0,0);
    blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.95));
  }
  blob = await camUpright(blob);
  CAM.blob=blob; CAM.url=URL.createObjectURL(blob);
  $c("camShot").src=CAM.url; $c("camShot").hidden=false; $c("camVideo").hidden=true;
  $c("camLive").hidden=true; $c("camReview").hidden=false;
  CAM.busy=false;
  buzz(30);
}

// If the photo came out sideways compared to how the Zebra is held, turn it upright (only then is it re-encoded).
async function camUpright(blob){
  try{
    const v=$c("camVideo"), portrait=v.videoHeight>v.videoWidth;
    const bmp=await createImageBitmap(blob);
    const landscape=bmp.width>bmp.height;
    if(portrait===!landscape || v.videoHeight===v.videoWidth){ bmp.close && bmp.close(); return blob; }
    const cv=document.createElement("canvas"); cv.width=bmp.height; cv.height=bmp.width;
    const g=cv.getContext("2d"); g.translate(cv.width/2, cv.height/2); g.rotate((portrait?90:-90)*Math.PI/180); g.drawImage(bmp, -bmp.width/2, -bmp.height/2);
    bmp.close && bmp.close();
    return await new Promise(r=>cv.toBlob(r, blob.type==="image/png"?"image/png":"image/jpeg", 0.95)) || blob;
  }catch(e){ return blob; }
}

function camUpload(blob, ctx){
  const ext = blob.type==="image/png" ? "png" : "jpg";
  const fd=new FormData();
  fd.append("variant", S.variant); fd.append("section", ctx.section); fd.append("checkpoint", ctx.cp);
  fd.append("vehicle", S.vehicle); fd.append("replace", ctx.replace||""); fd.append("device", "");
  fd.append("file", blob, "photo."+ext);
  CAM.pending++; camQueue();
  const x=new XMLHttpRequest(); x.open("POST","/api/upload");
  x.onload=()=>{ CAM.pending--; camQueue(); let r; try{ r=JSON.parse(x.responseText); }catch(e){ r={error:"Hub error "+x.status}; }
    if(r.error){ toast("Not saved: "+r.error); buzz([80,50,80]); } else { S.lastOnDisk[S.variant]=Math.max(S.lastOnDisk[S.variant]||0, S.vehicle); if($c("cam").hidden){ try{ loadProgress(); render(); }catch(e){} } } };
  x.onerror=()=>{ CAM.pending--; camQueue(); toast("Photo not sent: is the Zebra still on the hotspot?"); buzz([80,50,80]); };
  x.send(fd);
}

function camAccept(){
  if(!CAM.blob) return null;
  const ctx={...CAM.ctx}; camUpload(CAM.blob, ctx);
  URL.revokeObjectURL(CAM.url); CAM.url=null; CAM.blob=null;
  return ctx;
}

document.addEventListener("DOMContentLoaded", () => {
  $c("camClose").innerHTML=ic("x"); $c("camRetake").querySelector(".c").innerHTML=ic("retake"); $c("camOk").querySelector(".c").innerHTML=ic("check");
  $c("camClose").onclick=()=>{ if(CAM.blob && !confirmLeave()) return; camClose(); };
  $c("camShutter").onclick=camShoot;
  $c("camRetake").onclick=()=>{ if(CAM.url) URL.revokeObjectURL(CAM.url); CAM.url=null; CAM.blob=null; camLive(); };
  $c("camOk").onclick=()=>{ camAccept(); camClose(); };
  $c("camNext").onclick=()=>{
    const ctx=camAccept(); if(!ctx) return;
    const nx=nextInSection(ctx.section, ctx.cp);
    if(nx){ CAM.ctx={section:ctx.section, cp:nx.id, replace:""}; camLabel(); camLive(); }
    else {
      camClose();
      toast(ctx.section==="interior" ? "Interior done" : "Exterior done");
      const other = ctx.section==="interior" ? "exterior" : "interior";
      if(V()[other].some(c=>!((S.progress[other]||{})[c.id]||[]).length)){ S.section=other; render(); }
    }
  };
  document.addEventListener("keydown", e => { if(!$c("cam").hidden && (e.key==="AudioVolumeUp"||e.key==="AudioVolumeDown"||e.key===" ") && !$c("camLive").hidden){ e.preventDefault(); camShoot(); } });
});
function confirmLeave(){ return true; }   // an unsaved shot is simply discarded when closing

function closeReview(){
  if(S.review && S.review.url) try{ URL.revokeObjectURL(S.review.url); }catch(e){}
  S.review=null;
  try{ loadProgress(); }catch(e){}
  render();
  const nxt=nextPending(); if(nxt) document.getElementById("cp-"+nxt.cp.id)?.scrollIntoView({block:"center"});
}
function showErr(msg){ const box=document.getElementById("err"); if(box) box.textContent=msg; else toast(msg); }

// ---------- actions ----------
function addFromInput(inputId){
  const inp=document.getElementById(inputId), name=inp ? inp.value.trim() : "";
  if(!name){ showErr("Type a name first."); return; }
  if(inputId==="add-color"){ ops.addColor(name); toast(`Added ${name}`); }
  else if(inputId==="add-variant"){ ops.addVariant(name, document.getElementById("variantFrom").value); toast(`Added ${name}`); }
  else if(inputId.startsWith("add-common-")){ ops.addCommon(inputId.slice(11), name); toast(`Added ${name} to every variant`); }
  else if(inputId.startsWith("add-own-")){ ops.addOwn(S.variant, inputId.slice(8), name); toast(`Added ${name} to ${V().name}`); }
  S.confirm=null; render(); document.getElementById(inputId)?.focus();
}
function listAction(a, id){
  const m=a.match(/^(color|variant|common-(?:interior|exterior)|own-(?:interior|exterior))(Up|Down|Del)$/);
  if(!m) return false;
  const [, g, op] = m, d = op==="Up" ? -1 : 1;
  if(g==="color") op==="Del" ? ops.removeColor(id) : ops.moveColor(id,d);
  else if(g==="variant") op==="Del" ? ops.removeVariant(id) : ops.moveVariant(id,d);
  else if(g.startsWith("common-")){ const s=g.slice(7); op==="Del" ? ops.removeCommon(s,id) : ops.moveCommon(s,id,d); }
  else { const s=g.slice(4); op==="Del" ? ops.removeOwn(S.variant,s,id) : ops.moveOwn(S.variant,s,id,d); }
  S.confirm=null; render(); return true;
}

$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  const a = b.dataset.act;
  try{
    if(listAction(a, b.dataset.id)) return;
    if(a==="grant"){ Native.requestStorage(); }
    else if(a==="openPunch"){ goHome(); }
    else if(a==="rvRetake"){
      const rv=S.review; if(!rv || rv.uploading) return;
      S.busy={section:rv.section, cp:rv.cp};
      Native.takePhoto(S.variant, rv.section, rv.cp, S.vehicle, rv.path || "");
    }
    else if(a==="rvOk"){ closeReview(); }
    else if(a==="rvNext"){
      const rv=S.review; if(!rv || rv.uploading) return;
      const nx=nextInSection(rv.section, rv.cp);
      closeReview();
      if(nx){
        S.section=rv.section; S.busy={section:rv.section, cp:nx.id}; render();
        Native.takePhoto(S.variant, rv.section, nx.id, S.vehicle, "");
      } else {
        const other = rv.section==="interior" ? "exterior" : "interior";
        toast(rv.section==="interior" ? "Interior done" : "Exterior done");
        const left = V()[other].some(c=>!((S.progress[other]||{})[c.id]||[]).length);
        if(left){ S.section=other; render(); }
      }
    }
    else if(a==="pickRole"){
      try{ localStorage.setItem("mv-role", b.dataset.r); }catch(err){}
      if(b.dataset.r==="laptop"){ loadLaptop(); S.screen="laptop"; } else { S.screen="launch"; }
      render(); window.scrollTo(0,0);
    }
    else if(a==="lapSettings"){ S.settingsFrom="laptop"; S.screen="global"; S.confirm=null; render(); window.scrollTo(0,0); }
    else if(a==="globalBack"){
      if(S.settingsFrom==="laptop"){ S.settingsFrom=null; loadLaptop(); S.screen="laptop"; render(); window.scrollTo(0,0); }
      else goHome();
    }
    else if(a==="toRole"){ S.menu=false; S.viewer=null; S.screen="role"; render(); window.scrollTo(0,0); }
    else if(a==="lapRefresh"){ loadLaptop(); S.lap.photos={}; render(); toast("Updated"); }
    else if(a==="lapToggle"){
      const id=b.dataset.id;
      if(S.lap.open===id){ S.lap.open=null; }
      else { S.lap.open=id; S.lap.photos[id]=nat("variantPhotos", id, 0, 48); }
      render();
    }
    else if(a==="lapMore"){
      const id=b.dataset.id, cur=S.lap.photos[id], more=nat("variantPhotos", id, cur.photos.length, 48);
      cur.photos=cur.photos.concat(more.photos); cur.total=more.total; render();
    }
    else if(a==="lapView"){
      const list=S.lap.photos[b.dataset.id].photos, i=+b.dataset.i, ph=list[i];
      S.viewer={path:ph.path, name:ph.name, url:nat("bigPreview", ph.path).url, index:i, total:list.length, from:"laptop", result:ph.result};
      S.confirm=null; render();
    }
    else if(a==="refreshHome"){ goHome(); }
    else if(a==="launch"){ goLaunch(); }
    else if(a==="home"){ goHome(); }
    else if(a==="menu"){ S.menu=true; render(); }
    else if(a==="menuClose"){ S.menu=false; render(); }
    else if(a==="global"){ S.menu=false; S.screen="global"; S.confirm=null; render(); window.scrollTo(0,0); }
    else if(a==="new"){
      if(S.cfg.colors.length){ S.sheet={vid:b.dataset.v, color:"", change:false}; render(); }
      else startVehicle(b.dataset.v, "");
    }
    else if(a==="changeColor"){ S.sheet={vid:S.variant, vehicle:S.vehicle, color:S.progress.color||"", change:true}; render(); }
    else if(a==="sheetCancel"){ S.sheet=null; render(); }
    else if(a==="sheetOk"){
      const sh=S.sheet; if(!sh.color) return;
      if(sh.change){ const r=nat("setVehicleColor", sh.vid, sh.vehicle, sh.color); S.sheet=null; loadProgress(); render();
        toast(`V${pad3(sh.vehicle)} · ${sh.color}${r.renamed ? ` · ${r.renamed} photo${r.renamed===1?"":"s"} moved` : ""}`); }
      else startVehicle(sh.vid, sh.color);
    }
    else if(a==="resume"){ openVehicle(b.dataset.v, +b.dataset.n); }
    else if(a==="settings"){ S.screen="setup"; S.returnTo="vehicle"; S.confirm=null; render(); window.scrollTo(0,0); }
    else if(a==="editVariant"){ S.variant=b.dataset.id; S.screen="setup"; S.returnTo="global"; S.confirm=null; render(); window.scrollTo(0,0); }
    else if(a==="settingsBack"){ setupBack(); }
    else if(a==="tab"){ S.section=b.dataset.s; render(); }
    else if(a==="shoot"){
      if(e.target.closest('[data-act="view"]')) return;
      startCapture(b.dataset.s, b.dataset.c, "");
    }
    else if(a==="view"){
      const list = S.progress[b.dataset.s][b.dataset.c], i = +b.dataset.i, ph = list[i];
      S.viewer = {path:ph.path, name:ph.name, url:nat("bigPreview", ph.path).url, section:b.dataset.s, cp:b.dataset.c, index:i, total:list.length, result:ph.result};
      S.confirm=null; render();
    }
    else if(a==="closeViewer"){ S.viewer=null; render(); }
    else if(a==="retake"){
      const ph=S.viewer; S.viewer=null; S.confirm=null; render();
      startCapture(ph.section, ph.cp, ph.path);
    }
    else if(a==="askDelPhoto"){ S.confirm="photo"; render(); }
    else if(a==="delPhoto"){
      const from=S.viewer.from; nat("deletePhoto", S.viewer.path); S.viewer=null; S.confirm=null;
      if(from==="browse") loadBrowse(S.browse.rel); else loadProgress();
      render(); toast("Photo deleted");
    }
    else if(a==="ask"){ S.confirm=b.dataset.key; render(); }
    else if(a==="cancelConfirm"){ S.confirm=null; render(); }
    else if(a==="add"){ addFromInput(b.dataset.input); }
    else if(a==="resetOwn"){ ops.resetOwn(S.variant); S.confirm=null; render(); toast(`${V().name} now uses the common checkpoints`); }
    else if(a==="openBrowse"){ S.menu=false; S.viewer=null; loadBrowse(""); S.screen="browse"; render(); window.scrollTo(0,0); }
    else if(a==="browseTo"){ loadBrowse(b.dataset.rel); render(); window.scrollTo(0,0); }
    else if(a==="browseUp"){ if(!S.browse.rel) goHome(); else { loadBrowse(S.browse.rel.split("/").slice(0,-1).join("/")); render(); } }
    else if(a==="browseView"){
      const i=+b.dataset.i, list=S.browse.photos, ph=list[i];
      S.viewer={path:ph.path, name:ph.name, url:nat("bigPreview", ph.path).url, index:i, total:list.length, from:"browse", result:ph.result};
      S.confirm=null; render();
    }
    else if(a==="openStats"){ openStats(); if(S.stats) S.stats.fromHome=false; }
    else if(a==="statVariantFromHome"){ openStats(b.dataset.id); S.stats.fromHome=true; }
    else if(a==="statVariant"){ S.stats.variant=b.dataset.id; S.stats.fromHome=false; S.stats.color="__all"; render(); window.scrollTo(0,0); }
    else if(a==="statBack"){ if(S.stats.fromHome) goHome(); else { S.stats.variant=null; render(); window.scrollTo(0,0); } }
    else if(a==="openZip"){
      const now=new Date(), t=`${two(now.getHours())}:${two(now.getMinutes())}`;
      S.menu=false;
      S.zip={fromDate:todayStr(now), fromTime:"00:00", toDate:todayStr(now), toTime:t, count:null, bytes:0, busy:null, result:null, msg:"", open:null};
      try{ S.zip.list=nat("listZips").zips; }catch(err){ S.zip.list=[]; }
      S.screen="zip"; refreshZipCount(); render(); window.scrollTo(0,0);
    }
    else if(a==="makeZip"){ const r=zipRange(); S.zip.busy="Zipping…"; S.zip.result=null; render(); Native.makeZip(r.from, r.to, r.label); }
    else if(a==="zipOpen"){ S.zip.open = S.zip.open===b.dataset.path ? null : b.dataset.path; render(); }
    else if(a==="openFolder"){
      const w=b.dataset.which, r=nat("openFolder", w);
      if(r.laptop){ toast(r.ok ? "Opened on the laptop screen" : "Couldn't open the folder on the laptop"); }
      else if(!r.ok){
        if(w==="photos"){ toast("No Files app found, showing folders here"); S.viewer=null; loadBrowse(""); S.screen="browse"; render(); window.scrollTo(0,0); }
        else { toast("No Files app found. Recent zips are listed below."); document.querySelector(".zips")?.scrollIntoView({behavior:"smooth"}); }
      }
    }
    else if(a==="shareZip"){ nat("shareZip", b.dataset.path, b.dataset.bt==="1"); toast("Downloading zip…"); }
  }catch(err){
    S.busy=null;
    showErr(err.message);
  }
});

$app.addEventListener("change", e => {
  const id=e.target.id;
  if(id==="sheetColor" && S.sheet){
    S.sheet.color=e.target.value;
    const ok=document.querySelector('[data-act="sheetOk"]'); if(ok) ok.disabled=!S.sheet.color;
    return;
  }
  if(S.screen==="stats"){
    if(id==="statRange") S.stats.range=e.target.value;
    else if(id==="statDate") S.stats.date=e.target.value || todayStr();
    else if(id==="statColor") S.stats.color=e.target.value;
    else return;
    render(); return;
  }
  if(S.screen!=="zip") return;
  const map={zFromDate:"fromDate", zFromTime:"fromTime", zToDate:"toDate", zToTime:"toTime"};
  if(!map[id]) return;
  S.zip[map[id]] = e.target.value || (id.endsWith("Time") ? (id==="zToTime"?"23:59":"00:00") : todayStr());
  try{ refreshZipCount(); }catch(err){ S.zip.msg=err.message; }
  S.zip.result=null; render();
});

$app.addEventListener("keydown", e => {
  if(e.key!=="Enter" || e.target.tagName!=="INPUT" || !e.target.id.startsWith("add-")) return;
  try{ addFromInput(e.target.id); }catch(err){ showErr(err.message); }
});

(function start(){
  try{
    S.storage = nat("storage");
    if(S.storage.granted){ loadConfig(); loadLastVehicles(); }
    if(S.storage.hub) S.screen="role";
    render();
    const waiting = window.Native.ready();
    if(waiting && waiting !== "null") window.onPhoto(waiting);
  }catch(e){
    $app.innerHTML = `<div class="launch-head"><p class="brand">MobileVision<em>.Ai</em></p></div>
      <div class="card stack"><b>Not connected</b><p class="meta" style="margin:0">${esc(e.message)}</p>
      <button class="btn primary block" onclick="location.reload()">Try again</button></div>`;
  }
})();
</script>
