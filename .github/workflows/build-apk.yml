name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk PunchCapture-v1.0.${{ github.run_number }}.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Punch Capture v1.0.${{ github.run_number }}
          body: Download the .apk below on the Zebra and open it to install or update.
          files: PunchCapture-v1.0.${{ github.run_number }}.apk
          make_latest: true
