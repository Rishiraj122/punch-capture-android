plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.rishiraj.punchcapture'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rishiraj.punchcapture'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    // One fixed key, so every new build installs over the old one.
    signingConfigs {
        punch {
            storeFile file('punch.keystore')
            storePassword 'punchcapture'
            keyAlias 'punch'
            keyPassword 'punchcapture'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.punch
        }
        debug {
            signingConfig signingConfigs.punch
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def camerax = '1.3.4'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'com.google.guava:listenablefuture:1.0'
}
