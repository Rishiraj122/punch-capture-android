<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181d">
<title>Punch Capture</title>
<style>
/* Layout: phone-first, three screens (variants → vehicle checklist → setup); system fonts so it works with no internet */
:root{
  --bg:#f0f2f4; --panel:#ffffff; --fg:#15191e; --muted:#5d6874; --line:#d5dbe1;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --sx:#9a9893;
  --accent:#0a6ebd; --accent-ink:#ffffff; --done:#1e8a4b; --done-soft:#e1f3e8; --warn:#c8322b; --chip:#e6eaee;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111418; --panel:#1a1f25; --fg:#e7ebef; --muted:#94a0ac; --line:#2b333c;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --sx:#6b6a66;
  --accent:#3d9be6; --accent-ink:#06121c; --done:#38b06b; --done-soft:#14281c; --warn:#e5584f; --chip:#232a32;
  color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 var(--f-ui);-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 120px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 0 10px;
  display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);margin-bottom:12px}
header.top h1{font-size:1.1rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.veh{font:700 .95rem var(--f-num);color:var(--accent)}
button{font:inherit;cursor:pointer}
.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:8px 12px;font-size:.9rem}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:650;font-size:1rem}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.variants{display:flex;flex-direction:column;gap:10px}
.variant h2{margin:0;font-size:1.1rem}
.meta{font-size:.85rem;color:var(--muted)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .btn{flex:1;min-width:130px;padding:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--chip);padding:4px;border-radius:12px}
.tab{border:0;background:transparent;color:var(--muted);padding:10px;border-radius:9px;font-weight:650}
.tab[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tab .n{font-family:var(--f-num);font-size:.82rem;margin-left:4px}
.progress{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin:10px 0 4px}
.progress i{display:block;height:100%;background:var(--done);transition:width .25s}
.cps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;
  grid-template-columns:1fr auto;gap:8px;align-items:center}
.cp.done{border-color:var(--done);background:var(--done-soft)}
.cp.next{border-color:var(--accent)}
.cp-name{font-weight:600;min-width:0}
.cp-file{font:.72rem var(--f-num);color:var(--muted);word-break:break-all}
.shoot{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 14px;font-weight:650;white-space:nowrap}
.cp.done .shoot{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.thumbs{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto}
.thumbs:empty{display:none}
.thumbs button{border:0;padding:0;background:none;flex:0 0 auto}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;display:block;border:1px solid var(--line)}
.busy{grid-column:1/-1;font-size:.85rem;color:var(--accent)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px);z-index:6}
.dock-in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.dock .btn{flex:1}
.dock .btn.primary{flex:2}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);gap:12px}
.viewer img{flex:1;min-height:0;width:100%;object-fit:contain}
.viewer .name{color:#e7ebef;font:.8rem var(--f-num);word-break:break-all}
.viewer .row-btns .btn.ghost{background:#222;color:#fff;border-color:#444}
.confirm{border:1px solid var(--warn);border-radius:12px;padding:12px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0}
.viewer .confirm{background:#1a1f25;color:#e7ebef}
input[type=text],select{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0}
.edit-list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.edit-list li{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.edit-list li:last-child{border-bottom:0}
.edit-list li span{flex:1;min-width:0}
.edit-list .x{border:0;background:none;color:var(--warn);font-size:.9rem;padding:4px 6px}
.empty{color:var(--muted);padding:12px;font-size:.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:30;max-width:90vw}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;display:flex;align-items:flex-end}
.sheet{background:var(--panel);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;
  padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:1.1rem}
.edit-list .x.mv{color:var(--fg);font-size:1.05rem;padding:4px 8px;border:1px solid var(--line);border-radius:8px}
.edit-list .x.edit{color:var(--accent)}
.edit-list .x[disabled]{opacity:.3}
.tag{color:var(--accent)}
.icon-btn.menu{font-size:1.2rem;padding:6px 14px}
.menu-sheet{gap:8px}
.menu-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);
  background:var(--bg);color:var(--fg);border-radius:12px;padding:14px}
.menu-item span{font-size:.85rem;color:var(--muted)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin-bottom:12px}
.crumb{border:0;background:none;color:var(--accent);font:600 .88rem var(--f-ui);padding:4px 2px;word-break:break-all;text-align:left}
.crumb:last-of-type{color:var(--fg)}
.crumb-sep{color:var(--muted)}
.folders{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.folders li+li{border-top:1px solid var(--line)}
.folders button{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--fg);padding:14px 12px;text-align:left;font:inherit}
.folder-ico{width:22px;height:16px;border-radius:3px;background:var(--accent);opacity:.85;flex:0 0 auto;position:relative}
.folder-ico::before{content:"";position:absolute;left:0;top:-4px;width:10px;height:5px;border-radius:2px 2px 0 0;background:var(--accent)}
.folder-name{flex:1;min-width:0;word-break:break-all;font-weight:600}
.folder-count{font:.85rem var(--f-num);color:var(--muted);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{border:0;padding:0;background:var(--chip);border-radius:8px;overflow:hidden;position:relative;aspect-ratio:1;max-width:100%}
.tile img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .2s}
.tile img.ready{opacity:1}
.tile-cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font:.66rem var(--f-num);padding:3px 5px;text-align:left}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input{flex:1;min-width:140px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile-stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile-stat span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tile-stat b{font:700 1.4rem var(--f-num);font-variant-numeric:tabular-nums}
.chart{margin-bottom:12px}
.chart h2{margin:0;font-size:1.02rem}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;flex:0 0 auto}
.hbars{display:flex;flex-direction:column;gap:6px}
.hbar{display:grid;grid-template-columns:minmax(0,44%) 1fr auto;align-items:center;gap:10px;border:0;background:none;color:var(--fg);
  padding:6px 0;font:inherit;text-align:left;width:100%}
button.hbar{cursor:pointer}
.hbar-label{font-size:.86rem;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.hbar-track{display:flex;gap:2px;height:16px;min-width:0}
.hbar-track i{display:block;height:100%;min-width:3px}
.hbar-track i:last-child{border-radius:0 4px 4px 0}
.hbar-val{font:600 .88rem var(--f-num);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.hbar.zero .hbar-label{color:var(--warn)}
.hbar.zero .hbar-val{color:var(--warn)}
.pie-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pie{width:150px;height:150px;max-width:100%;flex:0 0 auto}
.pie path,.pie circle{stroke:var(--panel);stroke-width:2;stroke-linejoin:round}
.pie-legend{list-style:none;margin:0;padding:0;flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px}
.pie-legend li{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;font-size:.9rem}
.pie-legend b{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pie-legend em{font-style:normal;color:var(--muted);font:.8rem var(--f-num);min-width:4ch;text-align:right}
.s1{background:var(--s1);fill:var(--s1)} .s2{background:var(--s2);fill:var(--s2)} .s3{background:var(--s3);fill:var(--s3)}
.s4{background:var(--s4);fill:var(--s4)} .s5{background:var(--s5);fill:var(--s5)} .s6{background:var(--s6);fill:var(--s6)}
.s7{background:var(--s7);fill:var(--s7)} .s8{background:var(--s8);fill:var(--s8)} .sx{background:var(--sx);fill:var(--sx)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.table-wrap table{width:100%;border-collapse:collapse;font-size:.88rem}
.table-wrap th,.table-wrap td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.table-wrap th:first-child,.table-wrap td:first-child{text-align:left}
.table-wrap th{color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.table-wrap tr:last-child td{border-bottom:0}
.err{color:var(--warn);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:9px 13px;border-radius:999px;font-weight:600;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.colorbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;font-size:.95rem}
.btn[disabled]{opacity:.5}
input[type=date],input[type=time]{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
const S = { cfg:null, screen:"home", variant:null, vehicle:null, section:"interior", progress:null,
            busy:null, viewer:null, confirm:null, lastOnDisk:{}, storage:null,
            returnTo:"home", zip:null, sheet:null, menu:false, browse:null, stats:null };
const $app = document.getElementById("app");
const SECTIONS = ["interior","exterior"];

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad3 = n => String(n).padStart(3,"0");
const V = () => S.cfg.variants.find(v => v.id === S.variant);
const clone = o => JSON.parse(JSON.stringify(o));

// Every call goes to the Android side (MainActivity.Bridge) and returns JSON.
function nat(name, ...args){
  if(!window.Native) throw new Error("Open this page inside the Punch Capture app.");
  const o = JSON.parse(window.Native[name](...args));
  if(o && o.error) throw new Error(o.error);
  return o;
}

let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false;
  clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, 2400); }
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

// ---------- config model ----------
// cfg = { colors:[{id,name}], common:{interior:[],exterior:[]}, variants:[{id,name,interior:[],exterior:[]}] }
// Common edits flow to every variant; variant edits stay with that variant.
function slug(t){
  const s = String(t).trim().replace(/[^A-Za-z0-9]+/g,"_").replace(/^_+|_+$/g,"");
  if(!s) throw new Error("Name must contain letters or numbers.");
  return s;
}
const itemId = t => slug(t).toLowerCase();

function normalize(cfg){
  let changed=false;
  if(!cfg.common){
    const v0=cfg.variants[0]||{interior:[],exterior:[]};
    cfg.common={interior:clone(v0.interior||[]), exterior:clone(v0.exterior||[])}; changed=true;
  }
  if(!cfg.colors){
    const seen={}; cfg.colors=[];
    cfg.variants.forEach(v => (v.colors||[]).forEach(c => { if(!seen[c.id]){ seen[c.id]=1; cfg.colors.push(c); } }));
    changed=true;
  }
  cfg.variants.forEach(v => { if(v.colors){ delete v.colors; changed=true; } });
  return changed;
}

function commit(cfg){ S.cfg = nat("putConfig", JSON.stringify(cfg)); }
function edit(fn){ const c=clone(S.cfg); fn(c); commit(c); }
function findV(c, id){ return c.variants.find(v=>v.id===id); }
function move(arr, i, d){ const j=i+d; if(j<0||j>=arr.length) return false; [arr[i],arr[j]]=[arr[j],arr[i]]; return true; }

// Put the common checkpoints that a variant has into the common order, leaving its own extras where they are.
function followCommonOrder(list, common){
  const rank={}; common.forEach((c,i)=>rank[c.id]=i);
  const slots=[], items=[];
  list.forEach((c,i)=>{ if(c.id in rank){ slots.push(i); items.push(c); } });
  items.sort((a,b)=>rank[a.id]-rank[b.id]);
  slots.forEach((s,k)=>list[s]=items[k]);
}

const ops = {
  addColor(name){ edit(c=>{ const id=itemId(name);
    if(c.colors.some(x=>x.id===id)) throw new Error(`${name} is already in the color list.`);
    c.colors.push({id, name:name.trim()}); }); },
  removeColor(id){ edit(c=>{ c.colors=c.colors.filter(x=>x.id!==id); }); },
  moveColor(id,d){ edit(c=>{ move(c.colors, c.colors.findIndex(x=>x.id===id), d); }); },

  addVariant(name, from){ edit(c=>{ const id=slug(name);
    if(c.variants.some(v=>v.id.toLowerCase()===id.toLowerCase())) throw new Error(`Variant ${name} already exists.`);
    const src = from ? findV(c,from) : c.common;
    c.variants.push({id, name:name.trim(), interior:clone(src.interior), exterior:clone(src.exterior)}); }); },
  removeVariant(id){ edit(c=>{ c.variants=c.variants.filter(v=>v.id!==id); }); },
  moveVariant(id,d){ edit(c=>{ move(c.variants, c.variants.findIndex(v=>v.id===id), d); }); },

  addCommon(sec, name){ edit(c=>{ const id=itemId(name);
    if(c.common[sec].some(x=>x.id===id)) throw new Error(`${name} is already a common ${sec} checkpoint.`);
    const item={id, name:name.trim()};
    c.common[sec].push(item);
    c.variants.forEach(v=>{ if(!v[sec].some(x=>x.id===id)) v[sec].push(clone(item)); }); }); },
  removeCommon(sec, id){ edit(c=>{
    c.common[sec]=c.common[sec].filter(x=>x.id!==id);
    c.variants.forEach(v=>v[sec]=v[sec].filter(x=>x.id!==id)); }); },
  moveCommon(sec, id, d){ edit(c=>{
    if(!move(c.common[sec], c.common[sec].findIndex(x=>x.id===id), d)) return;
    c.variants.forEach(v=>followCommonOrder(v[sec], c.common[sec])); }); },

  addOwn(vid, sec, name){ edit(c=>{ const v=findV(c,vid), id=itemId(name);
    if(v[sec].some(x=>x.id===id)) throw new Error(`${name} is already in ${v.name} ${sec}.`);
    const fromCommon=c.common[sec].find(x=>x.id===id);
    v[sec].push(fromCommon ? clone(fromCommon) : {id, name:name.trim()}); }); },
  removeOwn(vid, sec, id){ edit(c=>{ const v=findV(c,vid); v[sec]=v[sec].filter(x=>x.id!==id); }); },
  moveOwn(vid, sec, id, d){ edit(c=>{ const v=findV(c,vid); move(v[sec], v[sec].findIndex(x=>x.id===id), d); }); },
  resetOwn(vid){ edit(c=>{ const v=findV(c,vid); v.interior=clone(c.common.interior); v.exterior=clone(c.common.exterior); }); },
};

// ---------- data ----------
function loadConfig(){
  const c = nat("getConfig");
  if(normalize(c)){ S.cfg=c; commit(c); } else S.cfg=c;
}
function loadLastVehicles(){ S.lastOnDisk = nat("lastVehicles"); }
function loadProgress(){ S.progress = nat("progress", S.variant, S.vehicle); }

function counts(section){
  const v=V(), p=S.progress||{}; let done=0;
  v[section].forEach(c => { if(((p[section]||{})[c.id]||[]).length) done++; });
  return {done, total:v[section].length};
}
function nextPending(){
  for(const s of SECTIONS)
    for(const c of V()[s]) if(!((S.progress[s]||{})[c.id]||[]).length) return {section:s, cp:c};
  return null;
}

// ---------- render ----------
function render(){
  if(S.storage && !S.storage.granted) return renderPermission();
  ({home:renderHome, vehicle:renderVehicle, setup:renderSetup, global:renderGlobal, zip:renderZip,
    browse:renderBrowse, stats:renderStats})[S.screen]();
  if(S.sheet) $app.insertAdjacentHTML("beforeend", sheetHTML());
  if(S.menu) $app.insertAdjacentHTML("beforeend", menuHTML());
}

function renderPermission(){
  $app.innerHTML = `
    <header class="top"><h1>Punch Capture</h1></header>
    <div class="card">
      <h2 style="margin:0;font-size:1.1rem">Allow file access</h2>
      <p style="margin:0">Photos are saved in a <b>PunchCapture</b> folder on this device, sorted by variant and checkpoint, so you can copy it to a laptop over USB.</p>
      <p class="meta" style="margin:0">On the next screen, turn on <b>Allow access to manage all files</b> for Punch Capture, then come back.</p>
      <button class="btn primary" data-act="grant">Open settings</button>
    </div>`;
}

function renderHome(){
  const items = S.cfg.variants.map(v => {
    const last = S.lastOnDisk[v.id] || 0;
    return `<div class="card variant">
      <div><h2>${esc(v.name)}</h2>
      <div class="meta">${v.interior.length} interior · ${v.exterior.length} exterior · ${last ? "last vehicle V"+pad3(last) : "no photos yet"}</div></div>
      <div class="row-btns">
        <button class="btn primary" data-act="new" data-v="${v.id}">New vehicle</button>
        ${last ? `<button class="btn ghost" data-act="resume" data-v="${v.id}" data-n="${last}">Continue V${pad3(last)}</button>` : ""}
      </div></div>`;
  }).join("");
  $app.innerHTML = `
    <header class="top"><h1>Punch Capture</h1>
      <button class="icon-btn menu" data-act="menu" aria-label="Menu">☰</button></header>
    <div class="variants">${items || `<div class="empty">No variants yet. Add one from ☰ → Settings.</div>`}</div>

// ---------- zip ----------
function two(n){ return String(n).padStart(2,"0"); }
function todayStr(d=new Date()){ return `${d.getFullYear()}-${two(d.getMonth()+1)}-${two(d.getDate())}`; }
function mb(b){ return b >= 1e9 ? (b/1e9).toFixed(2)+" GB" : (b/1e6).toFixed(1)+" MB"; }
function zipRange(){
  const z=S.zip, [y,m,d]=z.date.split("-").map(Number);
  const [fh,fm]=z.from.split(":").map(Number), [th,tm]=z.to.split(":").map(Number);
  const from=new Date(y,m-1,d,fh,fm,0,0).getTime(), to=new Date(y,m-1,d,th,tm,59,999).getTime();
  return {from, to, label:`${z.date}_${z.from.replace(":","")}-${z.to.replace(":","")}`};
}
function refreshZipCount(){
  const r=zipRange();
  if(r.to < r.from){ S.zip.count=null; S.zip.msg="The end time is before the start time."; return; }
  const c=nat("zipCount", r.from, r.to); S.zip.count=c.count; S.zip.bytes=c.bytes; S.zip.msg="";
}

function renderZip(){
  const z=S.zip;
  $app.innerHTML = `
    <header class="top"><button class="icon-btn" data-act="home">‹ Back</button><h1>Zip photos</h1></header>
    <div class="card">
      <label class="meta" for="zDate">Date</label>
      <input type="date" id="zDate" value="${z.date}" max="${todayStr()}">
      <div class="row-btns">
        <div style="flex:1;min-width:120px"><label class="meta" for="zFrom">From</label><input type="time" id="zFrom" value="${z.from}"></div>
        <div style="flex:1;min-width:120px"><label class="meta" for="zTo">To</label><input type="time" id="zTo" value="${z.to}"></div>
      </div>
      <div class="meta" id="zCount">${z.msg ? `<span class="err">${esc(z.msg)}</span>` :
        z.count==null ? "" : z.count ? `<b>${z.count}</b> photo${z.count===1?"":"s"} · about ${mb(z.bytes)}` : "No photos in this range."}</div>
      <button class="btn primary" data-act="makeZip" ${(z.busy||!z.count)?"disabled":""}>${z.busy ? esc(z.busy) : "Make zip"}</button>
    </div>
    ${z.result ? `<div class="card" style="margin-top:12px;border-color:var(--done)">
        <div><b>Zip ready</b> · ${z.result.count} photos · ${mb(z.result.bytes)}</div>
        <div class="cp-file">${esc(z.result.path)}</div>
        <div class="meta">Copy it over USB from Download/PunchCapture_Zips, or send it to another phone.</div>
        <button class="btn ghost" data-act="shareZip">Send zip…</button>
      </div>` : ""}
    <p class="meta" style="margin-top:12px">Photos are matched by the time they were taken (or last retaken). The zip also includes capture_log.csv, vehicles.csv and config.json.</p>`;
}

window.onZipProgress = function(done,total){ if(S.zip){ S.zip.busy=`Zipping ${done} of ${total}…`; if(S.screen==="zip") render(); } };
window.onZip = function(raw){
  const r=JSON.parse(raw); if(!S.zip) return;
  S.zip.busy=null;
  if(r.error){ toast(r.error); } else { S.zip.result=r; buzz(40); toast("Zip saved"); }
  if(S.screen==="zip") render();
};

// ---------- dashboard ----------
const SERIES = 8;
function colorSlot(name){            // color follows the entity: its position in the shared color list
  const i = S.cfg.colors.findIndex(c=>c.name===name);
  return i < 0 ? null : i;
}

function dayRange(f){
  if(f.range==="all") return null;
  const ds = f.range==="today" ? todayStr() : f.date;
  const [y,m,d]=ds.split("-").map(Number);
  return [new Date(y,m-1,d).getTime(), new Date(y,m-1,d,23,59,59,999).getTime()];
}

function statsModel(){
  const st=S.stats, rng=dayRange(st);
  const photos = st.raw.filter(p => !rng || (p.t>=rng[0] && p.t<=rng[1]));
  const vehicles = {};
  photos.forEach(p => {
    if(!p.n) return;
    const k=p.v+"|"+p.n;
    (vehicles[k] = vehicles[k] || {v:p.v, n:p.n, col:p.col, cps:new Set()}).cps.add(p.s+"/"+p.c);
  });
  const order = S.cfg.variants.map(v=>v.id);
  photos.forEach(p => { if(!order.includes(p.v)) order.push(p.v); });
  const byVariant = order.map(id => {
    const v=findV(S.cfg,id), need = v ? SECTIONS.flatMap(s=>v[s].map(c=>s+"/"+c.id)) : [];
    const vs = Object.values(vehicles).filter(x=>x.v===id);
    const complete = vs.filter(x => need.length && need.every(k=>x.cps.has(k))).length;
    return {id, name: v ? v.name : id, complete, partial: vs.length-complete, vehicles: vs,
            photos: photos.filter(p=>p.v===id)};
  });
  return {photos, vehicles:Object.values(vehicles), byVariant};
}

function hbar(label, segs, max, act){
  const total = segs.reduce((a,s)=>a+s.n,0);
  return `<${act?`button data-act="${act.a}" data-id="${esc(act.id)}"`:"div"} class="hbar">
    <span class="hbar-label">${esc(label)}</span>
    <span class="hbar-track">${segs.filter(s=>s.n).map(s=>`<i class="${s.cls}" style="width:${max? s.n/max*100 : 0}%"></i>`).join("")}</span>
    <span class="hbar-val">${total}</span></${act?"button":"div"}>`;
}

function pieSVG(slices){
  const total=slices.reduce((a,s)=>a+s.n,0), R=70, C=80;
  if(!total) return "";
  if(slices.filter(s=>s.n).length===1){
    const s=slices.find(x=>x.n);
    return `<svg viewBox="0 0 160 160" class="pie" role="img" aria-label="${esc(s.label)} 100%"><circle cx="${C}" cy="${C}" r="${R}" class="${s.cls}"/></svg>`;
  }
  let a=-Math.PI/2, paths="";
  slices.filter(s=>s.n).forEach(s=>{
    const a2=a+s.n/total*Math.PI*2, large=(a2-a)>Math.PI?1:0;
    const x1=C+R*Math.cos(a), y1=C+R*Math.sin(a), x2=C+R*Math.cos(a2), y2=C+R*Math.sin(a2);
    paths+=`<path d="M${C},${C} L${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" class="${s.cls}"/>`;
    a=a2;
  });
  return `<svg viewBox="0 0 160 160" class="pie" role="img" aria-label="Vehicles by color">${paths}</svg>`;
}

function statsFilterHTML(){
  const st=S.stats;
  return `<div class="filters">
    <select id="statRange" aria-label="Date range">

function renderStats(){
  const st=S.stats, m=statsModel();
  if(st.variant) return renderStatsVariant(m);
  const max=Math.max(1,...m.byVariant.map(r=>r.complete+r.partial));
  const rows=m.byVariant.map(r=>hbar(r.name,[{n:r.complete,cls:"s1"},{n:r.partial,cls:"s2"}],max,{a:"statVariant",id:r.id})).join("");
  $app.innerHTML = `
    <header class="top"><button class="icon-btn" data-act="home">‹ Back</button><h1>Dashboard</h1></header>
    ${statsFilterHTML()}
    <div class="tiles">
      <div class="tile-stat"><span>Vehicles</span><b>${m.vehicles.length}</b></div>
      <div class="tile-stat"><span>Photos</span><b>${m.photos.length}</b></div>
      <div class="tile-stat"><span>Complete</span><b>${m.byVariant.reduce((a,r)=>a+r.complete,0)}</b></div>
    </div>
    <div class="card chart">
      <h2>Vehicles per variant</h2>
      <div class="legend"><span><i class="sw s1"></i>Complete</span><span><i class="sw s2"></i>Partial</span></div>
      <div class="hbars">${rows || `<div class="empty">No variants yet.</div>`}</div>
      <div class="meta">Complete = every checkpoint of that variant has at least one photo. Tap a variant for colors and checkpoints.</div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Variant</th><th>Complete</th><th>Partial</th><th>Photos</th></tr></thead>
      <tbody>${m.byVariant.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.complete}</td><td>${r.partial}</td><td>${r.photos.length}</td></tr>`).join("")}</tbody>
    </table></div>`;
}

function renderStatsVariant(m){
  const st=S.stats, r=m.byVariant.find(x=>x.id===st.variant) || {name:st.variant, vehicles:[], photos:[], complete:0, partial:0};
  const v=findV(S.cfg, st.variant);
  // pie: vehicles per color
  const counts={}; r.vehicles.forEach(x=>{ const k=x.col||""; counts[k]=(counts[k]||0)+1; });
  let slices = Object.keys(counts).map(k=>{
    const slot = k ? colorSlot(k) : null;
    return {label:k||"Not set", n:counts[k], slot};
  }).sort((a,b)=> (a.slot??99)-(b.slot??99) || a.label.localeCompare(b.label));
  const named = slices.filter(s=>s.slot!==null && s.slot<SERIES);
  const rest = slices.filter(s=>!(s.slot!==null && s.slot<SERIES));
  slices = named.map(s=>({...s, cls:"s"+(s.slot+1)}));
  const restN = rest.reduce((a,s)=>a+s.n,0);
  if(restN) slices.push({label: rest.length===1 ? rest[0].label : "Other / not set", n:restN, cls:"sx"});
  const totalV = r.vehicles.length;

  // bars: images per checkpoint, optionally for one color
  const colorSel = st.color;
  const ph = r.photos.filter(p => colorSel==="__all" || (colorSel==="__none" ? !p.col : p.col===colorSel));
  const per = {}; ph.forEach(p=>{ const k=p.s+"/"+p.c; per[k]=(per[k]||0)+1; });
  const sectionRows = s => {
    const list = v ? v[s].map(c=>({id:c.id, name:c.name})) : [];
    Object.keys(per).forEach(k=>{ const [sec,id]=k.split("/"); if(sec===s && !list.some(x=>x.id===id)) list.push({id, name:id+" (removed)"}); });
    return list;
  };
  const allRows = SECTIONS.flatMap(s=>sectionRows(s).map(c=>per[s+"/"+c.id]||0));
  const max = Math.max(1, ...allRows);
  const usedColors = [...new Set(r.vehicles.map(x=>x.col).filter(Boolean))];
  const colorOpts = S.cfg.colors.map(c=>c.name).concat(usedColors.filter(c=>colorSlot(c)===null));

  $app.innerHTML = `
    <header class="top"><button class="icon-btn" data-act="statBack">‹ Back</button><h1>${esc(r.name)}</h1></header>
    ${statsFilterHTML()}
    <div class="tiles">
      <div class="tile-stat"><span>Vehicles</span><b>${totalV}</b></div>
      <div class="tile-stat"><span>Complete</span><b>${r.complete}</b></div>
      <div class="tile-stat"><span>Photos</span><b>${r.photos.length}</b></div>
    </div>
    <div class="card chart">
      <h2>Vehicles by color</h2>
      ${totalV ? `<div class="pie-wrap">${pieSVG(slices)}
        <ul class="pie-legend">${slices.map(s=>`<li><i class="sw ${s.cls}"></i><span>${esc(s.label)}</span><b>${s.n}</b><em>${Math.round(s.n/totalV*100)}%</em></li>`).join("")}</ul></div>`
        : `<div class="empty">No vehicles in this range.</div>`}
    </div>
    <div class="card chart">
      <h2>Images per checkpoint</h2>
      <select id="statColor" aria-label="Color">
        <option value="__all" ${colorSel==="__all"?"selected":""}>All colors</option>
        ${colorOpts.map(c=>`<option value="${esc(c)}" ${colorSel===c?"selected":""}>${esc(c)}</option>`).join("")}
        <option value="__none" ${colorSel==="__none"?"selected":""}>Color not set</option>
      </select>
      ${SECTIONS.map(s=>{ const rows=sectionRows(s); return `<p class="label">${s}</p>
        <div class="hbars">${rows.map(c=>{ const n=per[s+"/"+c.id]||0;
          return hbar(c.name,[{n,cls:"s1"}],max).replace('class="hbar"', `class="hbar${n?"":" zero"}"`); }).join("") || `<div class="empty">No ${s} checkpoints.</div>`}</div>`; }).join("")}
      <div class="meta">${ph.length} photo${ph.length===1?"":"s"}${colorSel==="__all"?"":" for this color"}. Checkpoints at 0 still need photos.</div>
    </div>`;
}

function openStats(){
  S.stats = S.stats || {range:"all", date:todayStr(), variant:null, color:"__all"};
  S.stats.raw = nat("stats").photos;
  S.stats.variant = null;
  S.screen="stats"; S.menu=false; render(); window.scrollTo(0,0);
}

// ---------- navigation ----------
function openVehicle(vid, n){
  S.variant=vid; S.vehicle=n; S.section="interior"; S.screen="vehicle"; S.viewer=null; S.confirm=null; S.sheet=null;
  loadProgress(); render(); window.scrollTo(0,0);
}
function startVehicle(vid, color){
  const r=nat("newVehicle", vid);
  if(color) nat("setVehicleColor", vid, r.vehicle, color);
  openVehicle(vid, r.vehicle);
  toast(`Started V${pad3(r.vehicle)}${color?" · "+color:""}`);
}
function goHome(){
  S.screen="home"; S.confirm=null; S.viewer=null; S.sheet=null;
  loadConfig(); loadLastVehicles(); render(); window.scrollTo(0,0);
}
function backToVehicle(){ S.screen="vehicle"; S.confirm=null; loadProgress(); render(); window.scrollTo(0,0); }
function setupBack(){
  if(S.returnTo==="vehicle") backToVehicle();
  else if(S.returnTo==="global"){ S.screen="global"; S.confirm=null; render(); window.scrollTo(0,0); }
  else goHome();
}

// Android back button: close overlays first, then go back a screen, then leave the app.
window.goBack = function(){
  if(S.menu){ S.menu=false; render(); return true; }
  if(S.sheet){ S.sheet=null; render(); return true; }
  if(S.viewer){ S.viewer=null; S.confirm=null; render(); return true; }
  if(S.confirm){ S.confirm=null; render(); return true; }
  if(S.screen==="setup"){ setupBack(); return true; }
  if(S.screen==="browse" && S.browse.rel){ loadBrowse(S.browse.rel.split("/").slice(0,-1).join("/")); render(); return true; }
  if(S.screen==="stats" && S.stats.variant){ S.stats.variant=null; render(); return true; }
  if(S.screen!=="home"){ goHome(); return true; }
  return false;
};

window.onNativeResume = function(){
  const was = S.storage && S.storage.granted;
  S.storage = nat("storage");
  if(S.storage.granted && !was){ loadConfig(); loadLastVehicles(); render(); }
};

// Called by Android when the camera returns.
window.onPhoto = function(raw){
  const r = JSON.parse(raw);
  S.busy = null;
  if(r.error){ buzz([80,50,80]); toast(r.error); if(S.screen==="vehicle") render(); return; }
  if(S.screen!=="vehicle" || S.variant!==r.variant || S.vehicle!==r.vehicle){
    loadConfig(); openVehicle(r.variant, r.vehicle);   // app was restarted while the camera was open
  }
  if(r.cancelled){ render(); return; }
  buzz(40); toast((r.replaced ? "Retaken " : "Saved ") + r.name);
  S.lastOnDisk[r.variant] = Math.max(S.lastOnDisk[r.variant]||0, r.vehicle);
  loadProgress();
  const nxt=nextPending();
  const sectionLeft = V()[r.section].some(c => !((S.progress[r.section]||{})[c.id]||[]).length);
  S.section = (nxt && !sectionLeft) ? nxt.section : r.section;   // interior finished → jump to exterior
  render();
  const go = nxt || {cp:{id:r.checkpoint}};
  document.getElementById("cp-"+go.cp.id)?.scrollIntoView({block:"center"});
};

function showErr(msg){ const box=document.getElementById("err"); if(box) box.textContent=msg; else toast(msg); }

// ---------- actions ----------
function addFromInput(inputId){
  const inp=document.getElementById(inputId), name=inp ? inp.value.trim() : "";
  if(!name){ showErr("Type a name first."); return; }
  if(inputId==="add-color"){ ops.addColor(name); toast(`Added ${name}`); }
  else if(inputId==="add-variant"){ ops.addVariant(name, document.getElementById("variantFrom").value); toast(`Added ${name}`); }
  else if(inputId.startsWith("add-common-")){ ops.addCommon(inputId.slice(11), name); toast(`Added ${name} to every variant`); }
  else if(inputId.startsWith("add-own-")){ ops.addOwn(S.variant, inputId.slice(8), name); toast(`Added ${name} to ${V().name}`); }
  S.confirm=null; render(); document.getElementById(inputId)?.focus();
}

function listAction(a, id){
  // a = "<group>Up|Down|Del", group = color | variant | common-<sec> | own-<sec>
  const m=a.match(/^(color|variant|common-(?:interior|exterior)|own-(?:interior|exterior))(Up|Down|Del)$/);
  if(!m) return false;
  const [, g, op] = m, d = op==="Up" ? -1 : 1;
  if(g==="color") op==="Del" ? ops.removeColor(id) : ops.moveColor(id,d);
  else if(g==="variant") op==="Del" ? ops.removeVariant(id) : ops.moveVariant(id,d);
  else if(g.startsWith("common-")){ const s=g.slice(7); op==="Del" ? ops.removeCommon(s,id) : ops.moveCommon(s,id,d); }
  else { const s=g.slice(4); op==="Del" ? ops.removeOwn(S.variant,s,id) : ops.moveOwn(S.variant,s,id,d); }
  S.confirm=null; render(); return true;
}

$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  const a = b.dataset.act;
  try{
    if(listAction(a, b.dataset.id)) return;
    if(a==="grant"){ Native.requestStorage(); }
    else if(a==="home"){ goHome(); }
    else if(a==="global"){ S.menu=false; S.screen="global"; S.confirm=null; render(); window.scrollTo(0,0); }
    else if(a==="new"){
      if(S.cfg.colors.length){ S.sheet={vid:b.dataset.v, color:"", change:false}; render(); }
      else startVehicle(b.dataset.v, "");
    }
    else if(a==="changeColor"){ S.sheet={vid:S.variant, vehicle:S.vehicle, color:S.progress.color||"", change:true}; render(); }
    else if(a==="sheetCancel"){ S.sheet=null; render(); }
    else if(a==="sheetOk"){
      const sh=S.sheet; if(!sh.color) return;
      if(sh.change){ const r=nat("setVehicleColor", sh.vid, sh.vehicle, sh.color); S.sheet=null; loadProgress(); render();
        toast(`V${pad3(sh.vehicle)} · ${sh.color}${r.renamed ? ` · ${r.renamed} photo${r.renamed===1?"":"s"} renamed` : ""}`); }
      else startVehicle(sh.vid, sh.color);
    }
    else if(a==="resume"){ openVehicle(b.dataset.v, +b.dataset.n); }
    else if(a==="settings"){ S.screen="setup"; S.returnTo="vehicle"; S.confirm=null; render(); window.scrollTo(0,0); }
    else if(a==="editVariant"){ S.variant=b.dataset.id; S.screen="setup"; S.returnTo="global"; S.confirm=null; render(); window.scrollTo(0,0); }
    else if(a==="settingsBack"){ setupBack(); }
    else if(a==="tab"){ S.section=b.dataset.s; render(); }
    else if(a==="shoot"){
      S.busy={section:b.dataset.s, cp:b.dataset.c}; S.section=b.dataset.s; render();
      Native.takePhoto(S.variant, b.dataset.s, b.dataset.c, S.vehicle, "");
    }
    else if(a==="view"){
      const list = S.progress[b.dataset.s][b.dataset.c], i = +b.dataset.i, ph = list[i];
      S.viewer = {path:ph.path, name:ph.name, url:nat("bigPreview", ph.path).url, section:b.dataset.s, cp:b.dataset.c, index:i, total:list.length};
      S.confirm=null; render();
    }
    else if(a==="closeViewer"){ S.viewer=null; render(); }
    else if(a==="retake"){
      const ph=S.viewer; S.viewer=null; S.confirm=null;
      S.busy={section:ph.section, cp:ph.cp}; S.section=ph.section; render();
      Native.takePhoto(S.variant, ph.section, ph.cp, S.vehicle, ph.path);
    }
    else if(a==="askDelPhoto"){ S.confirm="photo"; render(); }
    else if(a==="delPhoto"){
      const from=S.viewer.from; nat("deletePhoto", S.viewer.path); S.viewer=null; S.confirm=null;
      if(from==="browse") loadBrowse(S.browse.rel); else loadProgress();
      render(); toast("Photo deleted");
    }
    else if(a==="menu"){ S.menu=true; render(); }
    else if(a==="menuClose"){ S.menu=false; render(); }
    else if(a==="openBrowse"){ S.menu=false; S.viewer=null; loadBrowse(""); S.screen="browse"; render(); window.scrollTo(0,0); }
    else if(a==="browseTo"){ loadBrowse(b.dataset.rel); render(); window.scrollTo(0,0); }
    else if(a==="browseUp"){ if(!S.browse.rel) goHome(); else { loadBrowse(S.browse.rel.split("/").slice(0,-1).join("/")); render(); } }
    else if(a==="browseView"){
      const i=+b.dataset.i, list=S.browse.photos, ph=list[i];
      S.viewer={path:ph.path, name:ph.name, url:nat("bigPreview", ph.path).url, index:i, total:list.length, from:"browse"};
      S.confirm=null; render();
    }
    else if(a==="openStats"){ openStats(); }
    else if(a==="statVariant"){ S.stats.variant=b.dataset.id; S.stats.color="__all"; render(); window.scrollTo(0,0); }
    else if(a==="statBack"){ S.stats.variant=null; render(); window.scrollTo(0,0); }
    else if(a==="ask"){ S.confirm=b.dataset.key; render(); }
    else if(a==="cancelConfirm"){ S.confirm=null; render(); }
    else if(a==="add"){ addFromInput(b.dataset.input); }
    else if(a==="resetOwn"){ ops.resetOwn(S.variant); S.confirm=null; render(); toast(`${V().name} now uses the common checkpoints`); }
    else if(a==="openZip"){
      const now=new Date();
      S.zip={date:todayStr(now), from:"00:00", to:`${two(now.getHours())}:${two(now.getMinutes())}`, count:null, bytes:0, busy:null, result:null, msg:""};
      S.screen="zip"; refreshZipCount(); render(); window.scrollTo(0,0);
    }
    else if(a==="makeZip"){ const r=zipRange(); S.zip.busy="Zipping…"; S.zip.result=null; render(); Native.makeZip(r.from, r.to, r.label); }
    else if(a==="shareZip"){ nat("shareZip", S.zip.result.path); }
  }catch(err){
    S.busy=null;
    showErr(err.message);
  }
});

$app.addEventListener("change", e => {
  const id=e.target.id;
  if(id==="sheetColor" && S.sheet){
    S.sheet.color=e.target.value;
    const ok=document.querySelector('[data-act="sheetOk"]'); if(ok) ok.disabled=!S.sheet.color;
    return;
  }
  if(S.screen==="stats"){
    if(id==="statRange") S.stats.range=e.target.value;
    else if(id==="statDate") S.stats.date=e.target.value || todayStr();
    else if(id==="statColor") S.stats.color=e.target.value;
    else return;
    render(); return;
  }
  if(S.screen!=="zip") return;
  if(id==="zDate") S.zip.date=e.target.value || todayStr();
  else if(id==="zFrom") S.zip.from=e.target.value || "00:00";
  else if(id==="zTo") S.zip.to=e.target.value || "23:59";
  else return;
  try{ refreshZipCount(); }catch(err){ S.zip.msg=err.message; }
  S.zip.result=null; render();
});

$app.addEventListener("keydown", e => {
  if(e.key!=="Enter" || e.target.tagName!=="INPUT" || !e.target.id.startsWith("add-")) return;
  try{ addFromInput(e.target.id); }catch(err){ showErr(err.message); }
});

(function start(){
  try{
    S.storage = nat("storage");
    if(S.storage.granted){ loadConfig(); loadLastVehicles(); }
    render();
    const waiting = window.Native.ready();          // a photo taken while the app was restarting
    if(waiting && waiting !== "null") window.onPhoto(waiting);
  }catch(e){
    $app.innerHTML = `<p class="err">${esc(e.message)}</p>`;
  }
})();
</script>
</body>
